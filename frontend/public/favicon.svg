<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 背景深墨渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2438"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- 东方金墨质感渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4a0"/>
      <stop offset="45%" stop-color="#e5b567"/>
      <stop offset="100%" stop-color="#b37d22"/>
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#d4a359" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 图标底盘：圆角方形与玄墨背景 -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="url(#bgGrad)" stroke="#d4a359" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- 内圈金墨微线 -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="12.5" ry="12.5" fill="none" stroke="#d4a359" stroke-opacity="0.18" stroke-width="1"/>

  <!-- 核心意象：InkLore 墨韵羽笔与灵感之锋 -->
  <g filter="url(#goldGlow)" transform="translate(11, 10)">
    <!-- 羽毛主体轮廓与流线 -->
    <path d="M22.5 33.5 C24.5 33.5 26.2 32.5 27.5 30.8 C34.5 21.5 39 12 40 4 C32 5 22.5 9.5 13.2 16.5 C11.5 17.8 10.5 19.5 10.5 21.5 L10.5 32 C10.5 32.8 11.2 33.5 12 33.5 Z" 
          fill="url(#goldGrad)"/>
    <!-- 笔尖与墨锋中轴 -->
    <path d="M28 8 L3 33" 
          stroke="#080c14" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M28 8 L3 33" 
          stroke="#ffe4a0" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
    <!-- 羽翼纹理横褶 -->
    <path d="M29 18 L16 18" 
          stroke="#080c14" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M26 24 L14 24" 
          stroke="#080c14" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 墨滴凝华点 -->
    <circle cx="2.5" cy="33.5" r="2.2" fill="url(#goldGrad)"/>
  </g>
</svg>