# Standalone Creator static server example. Mount frontend/dist at the root below.
# Set the API upstream for the deployment network; keep Admin on its own server.
events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;

        location /v1 {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8080;
        }

        # Missing static files must remain 404, rather than returning index.html.
        location /assets/ {
            try_files $uri =404;
        }

        # Keep this list aligned with apps/creator/src/navigation.ts.
        location ~ ^/(home|login|register|forgot-password|editor|outline|worldview|analysis)$ {
            try_files /index.html =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
