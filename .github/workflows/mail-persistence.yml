name: INK-273 Email Persistence Contract

on:
  pull_request:
    paths:
      - 'migrations/post_r1/**'
      - '.github/workflows/mail-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    name: Mail settings and OTP PostgreSQL 17 migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: inklore_ci
          POSTGRES_PASSWORD: ci_only_no_secret
          POSTGRES_DB: inklore_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inklore_ci -d inklore_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_DSN: postgres://inklore_ci:ci_only_no_secret@127.0.0.1:5432/inklore_ci?sslmode=disable
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: inklore_ci
      PGUSER: inklore_ci
      PGPASSWORD: ci_only_no_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply frozen R1 and post-R1 migrations to disposable PostgreSQL
        run: go run ./cmd/migrate -cmd up -dsn "$DATABASE_DSN" -timeout 150s
      - name: Confirm original R1 17 migrations unchanged
        run: |
          test "$(psql -X -Atc 'SELECT count(*) FROM schema_migrations')" = '17'
          test "$(psql -X -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'platform_%'")" -ge 5
      - name: Confirm post-R1 stream registered by the migration runner
        run: |
          test "$(psql -X -Atc 'SELECT count(*) FROM schema_migrations_post_r1')" -ge 2
          psql -X -Atc "SELECT to_regclass('llm_policy_version_references') IS NOT NULL" | grep -qx t
      - name: Assert mail secret and OTP persistence invariants
        run: psql -X -v ON_ERROR_STOP=1 -f migrations/post_r1/verify_email_schema.sql
