name: Repository Health Snapshot

on:
  workflow_dispatch:
  schedule:
    # Monday 10:21 Asia/Shanghai (UTC+8). Scheduled workflows run on default branch.
    - cron: "21 2 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  health:
    name: Weekly read-only insights
    runs-on: ubuntu-latest
    steps:
      - name: Summarize recent Issue and PR activity
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const start = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const baseUrl = "https://github.com/" + owner + "/" + repo;
            const [openIssuesAndPrs, allOpenPrs, recentIssuesAndPrs, recentClosedPrs] = await Promise.all([
              github.paginate(github.rest.issues.listForRepo, {owner, repo, state: "open", per_page: 100}),
              github.paginate(github.rest.pulls.list, {owner, repo, state: "open", per_page: 100}),
              github.paginate(github.rest.issues.listForRepo, {owner, repo, state: "closed", since: start.toISOString(), per_page: 100}),
              github.paginate(github.rest.pulls.list, {owner, repo, state: "closed", per_page: 100})
            ]);
            const openIssues = openIssuesAndPrs.filter(item => !item.pull_request).length;
            const openPrs = allOpenPrs.length;
            const draftPrs = allOpenPrs.filter(item => item.draft).length;
            const closedIssues = recentIssuesAndPrs.filter(item => !item.pull_request &&
              item.closed_at && new Date(item.closed_at) >= start).length;
            const mergedPrs = recentClosedPrs.filter(item => item.merged_at &&
              new Date(item.merged_at) >= start).length;
            await core.summary
              .addHeading("InkLore · 7-day GitHub activity")
              .addTable([
                [{data:"Metric",header:true},{data:"Count",header:true}],
                ["Open Issues",String(openIssues)],
                ["Open PRs",String(openPrs)],
                ["Draft PRs",String(draftPrs)],
                ["Issues closed (7d)",String(closedIssues)],
                ["PRs merged (7d)",String(mergedPrs)]
              ])
              .addRaw("\nThis is a read-only GitHub activity snapshot, not product acceptance evidence.\n")
              .addRaw("\n[Native Insights](" + baseUrl + "/pulse) | [Dependency graph](" + baseUrl + "/network/dependencies) | [Security](" + baseUrl + "/security)\n")
              .write();
