name: INK-228 Isolated Database Integration

on:
  pull_request:
    paths:
      - 'internal/agent/**'
      - 'internal/llm/**'
      - 'internal/app/**'
      - 'internal/platform/database/**'
      - 'migrations/**'
      - 'cmd/migrate/**'
      - 'scripts/ci/ink228_schema.sql'
      - '.github/workflows/ink228-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-db:
    name: INK-228 PostgreSQL 17 + Redis 7 (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inklore_ci
          POSTGRES_USER: inklore_ci
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inklore_ci -d inklore_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_DSN: postgres://inklore_ci:local_ci_only@127.0.0.1:5432/inklore_ci?sslmode=disable
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: inklore_ci
      PGUSER: inklore_ci
      PGPASSWORD: local_ci_only
      REDIS_ADDR: 127.0.0.1:6379
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Ensure CI-only database target
        shell: bash
        run: |
          set -euo pipefail
          test "$PGDATABASE" = "inklore_ci"
          test "$PGHOST" = "127.0.0.1"
          pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/6379; printf "*1\r\n\$4\r\nPING\r\n" >&3; read -r line <&3; [[ "$line" == "+PONG" ]]'
      - name: Apply InkLore embedded migrations
        run: go run ./cmd/migrate -cmd up -dsn "$DATABASE_DSN" -timeout 150s
      - name: Verify migration replay is idempotent
        run: go run ./cmd/migrate -cmd up -dsn "$DATABASE_DSN" -timeout 150s
      - name: Validate isolated LLM/Agent schema and tenant foreign keys
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/ci/ink228_schema.sql
