name: "功能建议"
description: "提出清晰、可验收的产品或工程能力"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "先核对真实源码和已有 Issues，说明用户场景与差距；未验证的能力不能当作已实现。"
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题"
      description: "解释使用者、场景和当前的实际限制"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "建议范围与不做什么"
      description: "标记涉及 Creator / Admin / Go / 数据库 / Agent 的边界"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "可复现验收条件"
      description: "提供可核查的场景、输入、期望输出和异常边界"
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: "关联设计或任务"
      placeholder: "Issue #n、源码、必要的决策记录或证据链接"
  - type: textarea
    id: risks
    attributes:
      label: "风险及依赖"
      description: "说明权限、租户隔离、兼容、迁移与外部模型副作用"
