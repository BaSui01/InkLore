name: "实施 / 独立验收"
description: "关联已有任务，登记可复现的实施或验收目标"
title: "[验收] "
body:
  - type: markdown
    attributes:
      value: "先核对现有 GitHub Issues 和依赖，不重复创建同义任务；实现与运行验收分别给证据。"
  - type: input
    id: id
    attributes:
      label: "关联 Issue / PR（已有时填写）"
      placeholder: "#15 或完整 GitHub 链接"
  - type: textarea
    id: scope
    attributes:
      label: "本轮边界与明确不做的内容"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "依赖及阻塞条件"
      description: "哪些前置任务已 done？哪些尚未获准？"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "独立验收步骤"
      description: "命令、基准 SHA、退出码、真实 API/PG/浏览器证据与失败路径"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "现有证据与 PR"
      description: "仅填写亲自核实的结果；未运行写未运行"
  - type: checkboxes
    id: boundaries
    attributes:
      label: "工程边界"
      options:
        - label: "不绕过 CI、敏感路径人工审阅、权限与数据保护"
          required: true
