# golangci-lint 配置
#
# 定位：可选的深度检查，**不纳入 CI 门禁**。
# 原因：首次启用会暴露大量历史代码问题，直接作为门禁会让 CI 长期变红，
# 反而掩盖真正的回归。CI 门禁是 make lint（gofmt + go vet + archguard），
# 这三项当前全绿且可稳定执行。
#
# 本地使用：
#   go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
#   make lint-deep
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
    - wastedassign

formatters:
  enable:
    - gofmt
